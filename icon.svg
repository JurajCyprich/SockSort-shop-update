<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbe38a"/>
      <stop offset="0.45" stop-color="#f0d050"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0.55" stop-color="#f0d050" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f0d050" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#vignette)"/>

  <!-- fine inner border for a premium framed feel -->
  <rect x="26" y="26" width="460" height="460" rx="94" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.35"/>

  <!-- single elegant sock, clean geometry, gold outline + subtle fill -->
  <g transform="translate(256 262) rotate(-6)">
    <!-- sock silhouette: tall cuff, smooth L-curve foot -->
    <path d="M -46 -150
             L 40 -150
             Q 52 -150 52 -138
             L 52 -20
             Q 52 4 36 22
             L -40 104
             Q -70 136 -104 112
             Q -132 92 -110 60
             L -60 -8
             Q -46 -26 -46 -52
             Z"
          fill="url(#gold)" fill-opacity="0.14"
          stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>

    <!-- cuff band -->
    <path d="M -46 -150 L 40 -150 Q 52 -150 52 -138 L 52 -120 L -46 -120 Z"
          fill="url(#gold)"/>
    <!-- cuff ribbing lines -->
    <g stroke="#161616" stroke-width="3" opacity="0.55" stroke-linecap="round">
      <line x1="-30" y1="-146" x2="-30" y2="-124"/>
      <line x1="-12" y1="-146" x2="-12" y2="-124"/>
      <line x1="6"  y1="-146" x2="6"  y2="-124"/>
      <line x1="24" y1="-146" x2="24" y2="-124"/>
    </g>

    <!-- toe accent line -->
    <path d="M -104 78 Q -96 96 -78 96" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- pairing spark: a small refined diamond, the "sort" signature -->
  <g transform="translate(316 340) rotate(45)">
    <rect x="-11" y="-11" width="22" height="22" rx="5" fill="url(#gold)"/>
  </g>
  <circle cx="316" cy="340" r="30" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.4"/>
</svg>
